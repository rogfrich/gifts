
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Wish App{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>
  
  <!-- Global navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <!-- App name/logo -->
      <a class="navbar-brand" href="{% url 'home' %}">🎁 Gifts App</a>
  {% if request.user.is_authenticated %}
      <!-- Navigation links + logout -->
      <div class="d-flex align-items-center gap-2">
        <span>Hello, <strong>{{ request.user.username }}!</strong></span>
        <a class="btn btn-outline-primary" href="{% url 'my_wishes' %}">My Wishes</a>
        <a class="btn btn-outline-secondary" href="{% url 'other_wishes' %}">Other Wishes</a>
        <a class="btn btn-outline-success" href="{% url 'my_claims' %}">My Claims</a>
  
        <!-- Logout form -->
        <form method="post" action="{% url 'logout' %}" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Logout</button>
        </form>
      </div>
    {% endif %}

    </div>
  </nav>

  <!-- Main page content -->
  <div class="container mb-5">
    {% block content %}
    {% endblock %}
  </div>

  <!-- Optional footer -->
  <footer class="text-center text-muted mt-5 mb-3">
    <small>&copy; {{ now.year }} Wish App</small>
  </footer>

  <!-- Optional Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
  crossorigin="anonymous"></script>
</body>
</html>
