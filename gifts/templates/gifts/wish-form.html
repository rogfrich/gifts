{% extends "gifts/base.html" %}
{% block content %}
  <h2>{% if form.instance.pk %}Edit Wish{% else %}Create a Wish{% endif %}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary mb-3">Save Wish</button>
  </form>
  <a href="{% url 'my_wishes' %}" class="btn btn-danger mb-3">Back to wishes</a>
{% endblock %}
