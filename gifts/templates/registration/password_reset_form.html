{% extends "gifts/base.html" %}

{% block content %}
  <h2 class="mb-4">Reset your password</h2>

  <form method="post" class="mb-4">
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_email" class="form-label">Email address</label>
      <input type="email" name="email" class="form-control" required id="id_email">
    </div>

    <button type="submit" class="btn btn-primary w-100 w-md-auto">Send reset link</button>
  </form>

  <p class="mt-3">
    <a href="{% url 'login' %}">Back to login</a>
  </p>
{% endblock %}
